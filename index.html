<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRINDVERSE</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0f;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        font-family: sans-serif;
        padding: 16px;
        box-sizing: border-box;
      }
      #app {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 12px;
      }
      .side-panel {
        width: 240px;
        background: #111827;
        border: 2px solid #374151;
        border-radius: 8px;
        padding: 12px;
        color: #e5e7eb;
        font-family: sans-serif;
        max-height: 260px;
        overflow-y: auto;
      }
      .side-panel h2 {
        margin: 0 0 12px 0;
        font-size: 15px;
        color: #facc15;
        position: sticky;
        top: 0;
        background: #111827;
      }
      .sidebar-stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #1f2937;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .toggle-row .toggle-label {
        font-size: 12px;
        color: #38bdf8;
      }
      .toggle-row .toggle-desc {
        font-size: 10px;
        color: #9ca3af;
        margin-top: 2px;
      }
      .toggle-switch {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
      .upgrade-item, .inventory-item, .equipment-slot, .skill-item {
        background: #1f2937;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .upgrade-item .name, .item-name, .skill-name {
        font-weight: bold;
        font-size: 13px;
        color: #38bdf8;
      }
      .upgrade-item .desc, .item-desc, .skill-desc {
        font-size: 11px;
        color: #9ca3af;
        margin: 4px 0;
      }
      .upgrade-item .level, .skill-level {
        font-size: 11px;
        color: #a3e635;
      }
      .slot-label {
        font-size: 10px;
        text-transform: uppercase;
        color: #6b7280;
        letter-spacing: 0.5px;
      }
      .item-empty {
        font-size: 12px;
        color: #4b5563;
        font-style: italic;
      }
      .empty-text {
        font-size: 12px;
        color: #6b7280;
        font-style: italic;
      }
      .item-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      button {
        padding: 6px;
        border: none;
        border-radius: 4px;
        background: #2563eb;
        color: white;
        font-size: 11px;
        cursor: pointer;
        flex: 1;
      }
      button:disabled {
        background: #4b5563;
        cursor: not-allowed;
      }
      button:hover:not(:disabled) {
        background: #1d4ed8;
      }
      .sell-btn {
        background: #b45309;
      }
      .sell-btn:hover:not(:disabled) {
        background: #92400e;
      }
      .unequip-btn {
        background: #b91c1c;
      }
      .unequip-btn:hover:not(:disabled) {
        background: #991b1b;
      }
      .sell-all-btn {
        width: 100%;
        background: #7c3aed;
        margin-bottom: 10px;
        padding: 8px;
        font-size: 12px;
      }
      .sell-all-btn:hover:not(:disabled) {
        background: #6d28d9;
      }
      .branch-title {
        font-size: 12px;
        font-weight: bold;
        margin: 10px 0 6px 0;
      }
      .skill-item.locked {
        opacity: 0.45;
      }
      .skill-points-label {
        font-size: 12px;
        color: #a3e635;
        margin-bottom: 8px;
      }
      .reset-skill-btn {
        width: 100%;
        background: #dc2626;
        margin-top: 6px;
        padding: 8px;
        font-size: 12px;
      }
      .reset-skill-btn:hover:not(:disabled) {
        background: #b91c1c;
      }

            * {
        transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.2s ease;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }
      button:active:not(:disabled) {
        transform: translateY(0px) scale(0.97);
      }
      .side-panel {
        transition: box-shadow 0.2s ease;
      }
      .side-panel:hover {
        box-shadow: 0 0 0 1px #4b5563;
      }
      .upgrade-item, .inventory-item, .equipment-slot, .skill-item {
        transition: background-color 0.15s ease, transform 0.1s ease;
      }
      .upgrade-item:hover, .inventory-item:hover, .equipment-slot:hover, .skill-item:hover {
        background: #263142;
      }
      #offline-modal-overlay > div {
        animation: modalPopIn 0.25s ease;
      }
      @keyframes modalPopIn {
        from { opacity: 0; transform: scale(0.9) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      #sound-toggle-btn:hover {
        background: #374151 !important;
      }

            @media (max-width: 900px) {
        body {
          align-items: center;
          padding: 8px;
        }
        #app {
          flex-direction: column;
          align-items: center;
          width: 100%;
        }
        #game-container canvas {
          max-width: 100%;
          height: auto;
        }
        .sidebar-stack {
          flex-direction: row;
          flex-wrap: wrap;
          width: 100%;
          justify-content: center;
        }
        .side-panel {
          width: 100%;
          max-width: 280px;
          max-height: 220px;
        }
        #sound-toggle-btn {
          top: auto;
          bottom: 8px;
          right: 8px;
        }
      }
    </style>
  </head>
  <body>
    <button id="sound-toggle-btn" style="position:fixed; top:12px; right:12px; z-index:50; padding:8px 12px; border:none; border-radius:6px; background:#1f2937; color:#e5e7eb; font-size:12px; cursor:pointer; border:1px solid #374151;">🔊 Sound</button>
    <div id="app">
      <div id="game-container"></div>
      <div class="sidebar-stack">
        <div id="automation-panel" class="side-panel">
          <h2>🤖 Automation</h2>
          <div id="automation-list"></div>
        </div>
                <div id="ascension-panel" class="side-panel">
          <h2>♻️ Ascension</h2>
          <div id="ascension-info"></div>
          <button id="ascend-btn" class="reset-skill-btn" style="background:#7c3aed;">✨ Ascend</button>
        </div>
        <div id="ascension-tree-panel" class="side-panel">
          <h2>🌌 Ascension Tree</h2>
          <div id="ascension-tree-list"></div>
        </div>
        <div id="upgrade-panel" class="side-panel">
          <h2>⚒️ Upgrades</h2>
          <div id="upgrade-list"></div>
        </div>
        <div id="skill-panel" class="side-panel">
          <h2>🌳 Skill Tree</h2>
          <div id="skill-points-label" class="skill-points-label"></div>
          <div id="skill-list"></div>
          <button id="reset-skill-btn" class="reset-skill-btn">♻️ Reset Skills</button>
        </div>
        <div id="equipment-panel" class="side-panel">
          <h2>🛡️ Equipment</h2>
          <div id="equipment-list"></div>
        </div>
        <div id="inventory-panel" class="side-panel">
          <h2>🎒 Inventory</h2>
          <button id="sell-all-common-btn" class="sell-all-btn">🏪 Sell All Common</button>
          <div id="inventory-list"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
  <div id="offline-modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center;">
      <div style="background:#111827; border:2px solid #374151; border-radius:10px; padding:24px; width:320px; color:#e5e7eb; font-family:sans-serif; text-align:center;">
        <h2 style="margin:0 0 12px 0; color:#facc15;">💤 Selamat Datang Kembali!</h2>
        <div id="offline-modal-body" style="font-size:13px; line-height:1.6; margin-bottom:16px;"></div>
        <button id="offline-modal-close" style="width:100%; padding:10px; border:none; border-radius:6px; background:#2563eb; color:white; font-size:13px; cursor:pointer;">Ambil Reward!</button>
      </div>
    </div>
</html>
